version: "3.8"

services:
  postgres:
    image: postgres
    container_name: shelby-shop
    ports:
      - "8000:8000"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: shelby-shop
    volumes:
      - data_postgres:/var/lib/postgresql/data

volumes:
  data_postgres:
